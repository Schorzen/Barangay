.cert .cf{margin-top:26px;font-size:.82em;line-height:1.6}

.cert .cf{overflow:hidden}.cert .qr{float:left;margin:0 14px 0 0;width:84px;height:84px;image-rendering:pixelated}

.pkres{display:grid;gap:4px}.pkopt{text-align:left;font:inherit;font-weight:400;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}.pkopt:hover{background:#EAF1FB}

.ic.ok{background:#D8F3EC;color:#0B5A4D;border:1px solid #9ADBC9}

@page{size:A4;margin:16mm}
@media print{body::before{display:none}header,main,dialog{display:none!important}body{background:#fff}#cert{display:block!important}.cert{font-size:12pt;min-width:0}}
</style>
</head>

async function parseImport(file){

 rows.forEach((r,i)=>{const o={};for(const k in r)o[k.trim().toLowerCase().replace(/\s+/g,"_")]=String(r[k]).trim();
  const name=o.full_name||o.name,pid=pm[key(o.purok)],sx=(o.sex||"").charAt(0).toUpperCase();
  if(!name)return bad.push("Row "+(i+2)+": no name");
  if(!pid)return bad.push("Row "+(i+2)+": unknown purok “"+(o.purok||"")+"”");
  IMP.push({full_name:name,birthdate:/^\d{4}-\d{2}-\d{2}$/.test(o.birthdate||"")?o.birthdate:null,sex:sx==="M"||sx==="F"?sx:null,purok_id:pid,sector:o.sector||null})});

const WM='<img class="wm" alt="" src="'+LOGO+'">';
const PB="BOBBY CABRERA"; // name printed under "Punong Barangay" on certificates
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const ord=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const TITLES={"Barangay clearance":"BARANGAY CLEARANCE","Certificate of indigency":"CERTIFICATE OF INDIGENCY","Certificate of residency":"CERTIFICATE OF RESIDENCY","Business clearance":"BARANGAY BUSINESS CLEARANCE"};
function certHTML(r,purpose){
 const p=r.residents||{},nm=esc((p.full_name||"").toUpperCase()),pu="<b>"+esc(purpose||"any legal purpose")+"</b>";
 let age="";if(p.birthdate){const b=new Date(p.birthdate),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;age=a}
 const who="<b>"+nm+"</b>"+(age!==""?", "+age+" years old":"")+(p.sex?", "+(p.sex==="F"?"female":"male"):"")+", ";
 const home="a resident of "+esc(p.puroks?.name||"this barangay")+", Barangay Talisay, Santa Fe, Cebu";
 const BODY={
  "Barangay clearance":"This is to certify that "+who+home+", has no derogatory record on file in this office as of this date.</p><p>This clearance is issued upon the request of the above-named person for "+pu+".",
  "Certificate of indigency":"This is to certify that "+who+home+", belongs to the indigent families of this barangay.</p><p>This certification is issued upon the request of the above-named person for "+pu+".",
  "Certificate of residency":"This is to certify that "+who+"is a bona fide resident of "+esc(p.puroks?.name||"this barangay")+", Barangay Talisay, Santa Fe, Cebu.</p><p>This certification is issued upon the request of the above-named person for "+pu+".",
  "Business clearance":"This is to certify that "+who+home+", is granted clearance by this office to operate a business within this barangay, subject to existing laws and ordinances.</p><p>This clearance is issued upon the request of the above-named person for "+pu+"."
 };
 const d=new Date();
 return '<div class="cert">'+WM+'<div class="ch">Republic of the Philippines<br>Province of Cebu<br>Municipality of Santa Fe<br><b>BARANGAY TALISAY</b><br><small>OFFICE OF THE PUNONG BARANGAY</small></div><h2 class="ct">'+esc(TITLES[r.type]||r.type.toUpperCase())+'</h2><p class="n"><b>TO WHOM IT MAY CONCERN:</b></p><p>'+(BODY[r.type]||"")+'</p><p>Issued this '+ord(d.getDate())+' day of '+MONTHS[d.getMonth()]+', '+d.getFullYear()+' at Barangay Talisay, Santa Fe, Cebu, Philippines.</p><div class="sig'+(r._sig?' hs':'')+'">'+(r._sig?'<img class="signimg" alt="" src="'+r._sig+'">':'')+'<b>HON. '+esc(PB)+'</b><br>Punong Barangay</div><div class="cf">'+qr(r,d)+'Ref. No.: '+esc(r.ref_no)+'<br>O.R. No.: '+(r._or?esc(r._or.or_no):"____________")+' &nbsp; Amount paid: '+(r._or?peso(r._or.amount):"____________")+'<br>Prepared by: '+esc(me.full_name)+(r.approved_at?'<br>Approved by the Punong Barangay on '+new Date(r.approved_at).toLocaleDateString("en-PH",{year:"numeric",month:"long",day:"numeric"}):"")+'<br><i>Not valid without the official dry seal.</i></div></div>'}
async function openPrint(id){
 const r=ROWS.requests[id];if(!r)return;
 const x=await sb.rpc("receipt_for",{p_ref:r.ref_no});r._or=(x.data&&x.data[0])||null;r._sig=["approved","released"].includes(r.status)?await getSig():"";
 dlg.className="wide";
 dlg.innerHTML='<h2>Print certificate</h2><label>Purpose<input id="pur" data-rid="'+id+'" value="any legal purpose"></label><div class="prev" id="prev">'+certHTML(r,"any legal purpose")+'</div><div class="acts"><button class="btn" data-doprint="'+id+'">Print</button><button type="button" class="btn ghost" data-close>Close</button></div><p class="note">Tip: in the print window you can choose “Save as PDF” instead of a printer.</p>';
 dlg.showModal()}
function doPrint(id){
 const r=ROWS.requests[id];if(!r)return;
 $("cert").innerHTML=certHTML(r,$("pur").value);
 sb.rpc("log_event",{p_action:"PRINT",p_detail:r.type+" "+r.ref_no});
 window.print()}
function fmtD(d){if(!d)return"____________";const[y,m,x]=d.split("-").map(Number);return new Date(y,m-1,x).toLocaleDateString("en-PH",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}
function fmtT(t){if(!t)return"____________";const[h,m]=t.split(":").map(Number);return(h%12||12)+":"+String(m).padStart(2,"0")+(h<12?" AM":" PM")}
function summHTML(b,o){
 const d=new Date(),c=esc((b.complainant_name||"").toUpperCase()),r=esc((b.respondent_name||"").toUpperCase());
 return '<div class="cert">'+WM+'<div class="ch">Republic of the Philippines<br>Province of Cebu<br>Municipality of Santa Fe<br><b>BARANGAY TALISAY</b><br><small>OFFICE OF THE PUNONG BARANGAY<br>LUPONG TAGAPAMAYAPA</small></div>'+
 '<div style="display:flex;justify-content:space-between;gap:16px;margin-top:16px"><div><b>'+c+'</b>,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Complainant,<br>&nbsp;&nbsp;– against –<br><b>'+r+'</b>,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Respondent.</div><div style="text-align:right">Barangay Case No. <b>'+esc(b.case_no)+'</b><br>For: <b>'+esc(b.incident)+'</b></div></div>'+
 '<h2 class="ct">'+esc(o.title||"SUMMONS")+'</h2><p class="n"><b>TO: '+r+'</b><br>'+esc(b.respondent_address||"")+'</p>'+
 '<p>You are hereby summoned to appear before me in person, together with your witnesses, on <b>'+esc(fmtD(o.d))+'</b> at <b>'+esc(fmtT(o.t))+'</b> at <b>'+esc(o.v||"the Barangay Hall")+'</b>, then and there to answer to a complaint made before me, copy of which is attached hereto, for mediation of your dispute with the complainant.</p>'+
 '<p>You are hereby warned that if you refuse or willfully fail to appear, you may be barred from filing any counterclaim arising from said complaint.</p><p><b>FAIL NOT</b> or face punishment for contempt of court.</p>'+
 '<p>Issued this '+ord(d.getDate())+' day of '+MONTHS[d.getMonth()]+', '+d.getFullYear()+' at Barangay Talisay, Santa Fe, Cebu, Philippines.</p>'+
 '<div class="sig"><b>HON. '+esc(PB)+'</b><br>Punong Barangay</div>'+
 '<div class="cf">Prepared by: '+esc(me.full_name)+'<br><b>Proof of service</b><br>Received by: ______________________ Date: ____________<br>Served by: ______________________ Date: ____________</div></div>'}
const DOCS={summons1:"Summons (1st)",summons2:"Second summons",summons3:"Third summons",notice:"Notice of hearing (to complainant)",kasunduan:"Kasunduan (settlement)",cfa:"Certificate to File Action"};

function upHTML(a){
 if(!a.length)return'<div class="panel"><h2>Upcoming hearings</h2><p class="note">No hearings in the next 14 days.</p></div>';
 const t=todayStr(),tm=ymd(new Date(Date.now()+864e5));
 return'<div class="panel"><h2>Upcoming hearings (next 14 days)</h2>'+tbl(["Date","Time","Case","Complainant","Respondent",""],a.map(x=>[fmtD(x.hearing_date),x.hearing_time?fmtT(x.hearing_time):"",x.case_no,x.complainant_name,x.respondent_name,x.hearing_date===t?{h:'<span class="chip received">Today</span>'}:x.hearing_date===tm?{h:'<span class="chip verified">Tomorrow</span>'}:""]))+'</div>'}
function docHTML(b,o){
 const k=o.k||"summons1",d=new Date(),c=esc((b.complainant_name||"").toUpperCase()),r=esc((b.respondent_name||"").toUpperCase());
 if(k.startsWith("summons"))return summHTML(b,{...o,title:{summons1:"SUMMONS",summons2:"SECOND SUMMONS",summons3:"THIRD SUMMONS"}[k]});
 const ttl=t=>'<h2 class="ct">'+t+'</h2>',when_='<b>'+esc(fmtD(o.d))+'</b> at <b>'+esc(fmtT(o.t))+'</b> at <b>'+esc(o.v||"the Barangay Hall")+'</b>';
 let body;
 if(k==="notice")body=ttl("NOTICE OF HEARING")+'<p class="n"><b>TO: '+c+'</b>, Complainant</p><p>You are hereby notified that your complaint against <b>'+r+'</b> for “'+esc(b.incident)+'” is set for hearing and mediation before the Punong Barangay on '+when_+'.</p><p>You are requested to appear in person and to bring your witnesses. Your failure to appear without a justifiable reason may result in the dismissal of your complaint.</p>';
 else if(k==="kasunduan")body=ttl("KASUNDUAN (AMICABLE SETTLEMENT)")+'<p>We, <b>'+c+'</b>, Complainant, and <b>'+r+'</b>, Respondent, both of legal age and residents of Barangay Talisay, Santa Fe, Cebu, having voluntarily agreed to settle our dispute (“'+esc(b.incident)+'”) before the Punong Barangay on <b>'+esc(fmtD(o.d))+'</b>, agree to the following terms:</p><p class="n" style="min-height:90px">'+(o.x?esc(o.x).replace(/\n/g,"<br>"):"______________________________________________<br>______________________________________________")+'</p><p>We understand that this settlement shall have the force and effect of a final judgment of a court after ten (10) days from its date, unless it is repudiated within that period as provided by law.</p><div style="display:flex;justify-content:space-between;margin-top:36px;text-align:center"><div style="width:44%;border-top:1px solid #000">'+c+'<br>Complainant</div><div style="width:44%;border-top:1px solid #000">'+r+'<br>Respondent</div></div>';
 else body=ttl("CERTIFICATE TO FILE ACTION")+'<p class="n"><b>TO WHOM IT MAY CONCERN:</b></p><p>This is to certify that in Barangay Case No. <b>'+esc(b.case_no)+'</b>, entitled <b>'+c+'</b> versus <b>'+r+'</b>, for “'+esc(b.incident)+'”: '+esc(o.g)+'</p><p>Therefore, the corresponding complaint may now be filed in the proper court or government office.</p><p>This certification is issued upon the request of the complainant, <b>'+c+'</b>.</p>';
 return'<div class="cert">'+WM+'<div class="ch">Republic of the Philippines<br>Province of Cebu<br>Municipality of Santa Fe<br><b>BARANGAY TALISAY</b><br><small>OFFICE OF THE PUNONG BARANGAY<br>LUPONG TAGAPAMAYAPA</small></div><div style="text-align:right;margin-top:12px">Barangay Case No. <b>'+esc(b.case_no)+'</b></div>'+body+'<p>Issued this '+ord(d.getDate())+' day of '+MONTHS[d.getMonth()]+', '+d.getFullYear()+' at Barangay Talisay, Santa Fe, Cebu, Philippines.</p><div class="sig"><b>HON. '+esc(PB)+'</b><br>Punong Barangay'+(k==="kasunduan"?'<br><small>(Attested)</small>':'')+'</div><div class="cf">Prepared by: '+esc(me.full_name)+'</div></div>'}
const sv=()=>({k:$("sdoc").value,d:$("sd").value,t:$("st").value,v:$("sv").value,x:$("sx").value,g:$("sg").value});
function refreshDoc(id){const b=ROWS.blotter[id],o=sv();$("xrow").hidden=o.k!=="kasunduan";$("grow").hidden=o.k!=="cfa";$("prev").innerHTML=docHTML(b,o)}
function openSumm(id){
 const b=ROWS.blotter[id];if(!b)return;dlg.className="wide";
 dlg.innerHTML='<h2>Barangay case documents</h2><div class="frm"><label>Document<select id="sdoc" data-rid="'+id+'">'+opts(Object.entries(DOCS))+'</select></label><label>Date<input id="sd" type="date" data-rid="'+id+'" value="'+esc(b.hearing_date||"")+'"></label><label>Time<input id="st" type="time" data-rid="'+id+'" value="'+esc(b.hearing_time||"")+'"></label><label>Place<input id="sv" data-rid="'+id+'" value="Barangay Hall, Barangay Talisay"></label></div><label id="xrow" hidden>Settlement terms (one per line)<textarea id="sx" rows="4" data-rid="'+id+'"></textarea></label><label id="grow" hidden>Ground<select id="sg" data-rid="'+id+'">'+opts(GROUNDS)+'</select></label><div class="prev" id="prev"></div><div class="acts"><button class="btn" data-dosumm="'+id+'">Print</button><button type="button" class="btn ghost" data-close>Close</button></div><p class="note">Choose the document, adjust the details, and check the preview before printing. Use “Edit” on the case to save a hearing date.</p>';
 refreshDoc(id);dlg.showModal()}
function doSumm(id){
 const b=ROWS.blotter[id];if(!b)return;const o=sv();
 $("cert").innerHTML=docHTML(b,o);
 sb.rpc("log_event",{p_action:"PRINT",p_detail:DOCS[o.k]+" "+b.case_no});
 window.print()}
const dlg=$("dlg");
function openEdit(t,id){
 const row=ROWS[t][id];if(!row)return;
 dlg.className="";dlg.innerHTML='<h2>Edit '+CFG[t].n+'</h2><form class="frm one" data-f="edit|'+t+'|'+id+'">'+CFG[t].f(true).map(f=>fld(f,row[f[0]])).join('')+'<div class="acts"><button class="btn">Save changes</button><button type="button" class="btn ghost" data-close>Cancel</button></div></form>';dlg.showModal()}
function openDel(t,id){
 const r=ROWS[t][id]||{},name=r.full_name||r.ref_no||r.case_no||r.or_no||r.description||r.program||"this record";
 dlg.className="";dlg.innerHTML='<h2>Delete '+CFG[t].n+'?</h2><p>“'+esc(name)+'” will be removed. This action is recorded in the activity log and can’t be undone.</p><form class="frm one" data-f="del|'+t+'|'+id+'"><div class="acts"><button class="btn danger">Yes, delete</button><button type="button" class="btn ghost" data-close>Cancel</button></div></form>';dlg.showModal()}
document.addEventListener("submit",async e=>{
 e.preventDefault();const f=e.target,n=f.dataset.f,o=Object.fromEntries(new FormData(f));
 if(n==="login"){const r=await sb.auth.signInWithPassword({email:o.email,password:o.password});if(r.error)return say("Sign-in failed. Check your email and password.");say("");await boot();sb.rpc("log_event",{p_action:"SIGN_IN"});return}
 if(n==="rsearch"){RQ=(o.q||"").trim();RP=0;return draw()}
 if(n==="hsearch"){HQ=(o.q||"").trim();HP=0;return draw()}
 if(n==="qsearch"){QQ=(o.q||"").trim();QP=0;return draw()}
 if(f.querySelector('[name="resident_id"]')&&!o.resident_id)return say("Please search and choose a resident from the list.");
 const [m,t,id]=n.split("|");
 if(m==="edit"){if(ok(await sb.from(t).update(pre(t,o)).eq("id",id).select())){dlg.close();say("Changes saved.",1);draw()}return}
 if(m==="del"){if(ok(await sb.from(t).delete().eq("id",id).select())){dlg.close();say("Deleted.",1);draw()}else dlg.close();return}
 if(m==="requests")o.ref_no="REQ-"+new Date().toISOString().slice(2,7).replace("-","")+"-"+Math.floor(100+Math.random()*900);
 if(ok(await sb.from(m).insert(pre(m,o)).select())){say("Added.",1);draw()}
});
let pkT;
document.addEventListener("input",e=>{
 if(e.target.dataset.pk!==undefined){clearTimeout(pkT);const el=e.target,q=el.value.trim();el.nextElementSibling.value="";
  pkT=setTimeout(async()=>{const box=el.parentElement.querySelector(".pkres");if(q.length<2){box.innerHTML="";return}
   const r=await sb.from("residents_basic").select("id,full_name,birthdate").ilike("full_name",lk(q)).order("full_name").limit(8);
   box.innerHTML=(r.data||[]).map(x=>'<button type="button" class="pkopt" data-pick="'+x.id+'" data-name="'+esc(x.full_name)+'">'+esc(x.full_name)+(x.birthdate?" · "+esc(x.birthdate):"")+'</button>').join("")||'<span class="note">No match. Check the spelling, or add the resident first.</span>'},250);return}
 if(["sdoc","sd","st","sv","sx","sg"].includes(e.target.id)){refreshDoc(e.target.dataset.rid);return}if(e.target.id==="pur"){$("prev").innerHTML=certHTML(ROWS.requests[e.target.dataset.rid],e.target.value);return}const k=e.target.dataset.filter;if(!k)return;const q=e.target.value.toLowerCase();document.querySelectorAll("#"+k+" tr").forEach(r=>{r.hidden=!r.textContent.toLowerCase().includes(q)})});
document.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if("report" in b.dataset)return report();
 if("tpl" in b.dataset)return tpl();
 if("doimp" in b.dataset)return doImport();
 if(b.dataset.summ)return openSumm(b.dataset.summ);
 if(b.dataset.dosumm)return doSumm(b.dataset.dosumm);
 if(b.dataset.print)return openPrint(b.dataset.print);
 if(b.dataset.doprint)return doPrint(b.dataset.doprint);
 if(b.dataset.pick){const l=b.closest("label");l.querySelector("[data-pk]").value=b.dataset.name;l.querySelector("input[type=hidden]").value=b.dataset.pick;l.querySelector(".pkres").innerHTML="";return}
 if(b.dataset.rpage){RP=Math.max(0,RP+ +b.dataset.rpage);return draw()}
 if(b.dataset.qpage){QP=Math.max(0,QP+ +b.dataset.qpage);return draw()}
 if(b.dataset.hpage){HP=Math.max(0,HP+ +b.dataset.hpage);return draw()}
 if("qclear" in b.dataset){QQ="";QP=0;return draw()}
 if("rclear" in b.dataset){RQ="";RP=0;return draw()}
 if("hclear" in b.dataset){HQ="";HP=0;return draw()}
 if("close" in b.dataset)return dlg.close();
 if(b.dataset.edit)return openEdit(...b.dataset.edit.split("|"));
 if(b.dataset.del)return openDel(...b.dataset.del.split("|"));
 if(b.id==="out"){await sb.rpc("log_event",{p_action:"SIGN_OUT"});await sb.auth.signOut();say("");return loginScreen()}
 if(b.dataset.t){tab=b.dataset.t;say("");sb.rpc("log_event",{p_action:"VIEW",p_detail:MODS[tab]});return draw()}
 if(b.dataset.adv){if(ok(await sb.from("requests").update({status:b.dataset.to}).eq("id",b.dataset.adv).select())){say(b.dataset.to==="approved"?"Approved.":"Updated.",1);draw()}return}
 if(b.dataset.save){const id=b.dataset.save,role=document.querySelector('[data-role="'+id+'"]').value||null,a=document.querySelector('[data-act="'+id+'"]').checked;
  if(a&&!role)return say("Choose a role before activating this account.");
  if(ok(await sb.from("profiles").update({role,is_active:a}).eq("id",id).select())){sb.rpc("log_event",{p_action:"ROLE_CHANGE",p_detail:"Account "+id+" set to "+(role||"none")+(a?", active":", inactive")});say("Account saved.",1);draw()}}
});
document.addEventListener("change",e=>{
 if(e.target.id==="mo"&&e.target.value){MONTH=e.target.value;draw()}
 if(e.target.id==="xl"&&e.target.files[0]){parseImport(e.target.files[0]);e.target.value=""}});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")loginScreen()});
boot();
</script>
</body>
</html>
