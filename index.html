async function parseImport(file){

function certHTML(r,purpose,pv){
 const p=r.residents||{},nm=esc((p.full_name||"").toUpperCase()),pu="<b>"+esc(purpose||"any legal purpose")+"</b>";
 let age="";if(p.birthdate){const b=new Date(p.birthdate),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;age=a}
 const base="<b>"+nm+"</b>"+(age!==""?", "+age+" years old":"")+(p.sex?", "+(p.sex==="F"?"female":"male"):""),csx=p.civil_status?", "+esc(p.civil_status==="Live-in"?"in a live-in relationship":p.civil_status.toLowerCase()):"",who=base+csx+", ",whoN=base+", ";

  "Barangay clearance":"This is to certify that "+who+home+", has no derogatory record on file in this office as of this date.</p><p>This clearance is issued upon the request of the above-named person for "+pu+".",

  "Business clearance":"This is to certify that "+who+home+", is granted clearance by this office to operate a business within this barangay, subject to existing laws and ordinances.</p><p>This clearance is issued upon the request of the above-named person for "+pu+"."
 };
 const d=r.approved_at?new Date(r.approved_at):new Date();
 const ext=r._ext||"",bl="____________",ptn=r.details?"<b>"+esc(r.details.toUpperCase())+"</b>":"<b>"+bl+"</b>";
 BODY[CL]="This is to certify that "+whoN+"and "+ptn+", both of legal age, are residents of "+esc(p.puroks?.name||"this barangay")+", Barangay Talisay, Santa Fe, Cebu, and are living together as common-law husband and wife (live-in partners)"+(ext?" for <b>"+esc(ext)+"</b>":"")+", based on the records and knowledge of this office.</p><p>This certification is issued upon the request of the above-named person for "+pu+".";
 BODY[SP]="This is to certify that "+who+home+", is a solo parent who is raising "+(r.details?"the child/children <b>"+esc(r.details)+"</b>":"his/her child/children")+" as the sole provider and caregiver, based on the records and knowledge of this office.</p><p>This certification is issued upon the request of the above-named person for "+pu+", including the availment of benefits under the Expanded Solo Parents Welfare Act (RA 11861).";

 const oath=!r.type||r.type!==FJ?"":'<div class="cert tight pg2">'+WM+HEAD("OFFICE OF THE PUNONG BARANGAY")+'<h2 class="ct">OATH OF UNDERTAKING</h2><p>I, <b>'+nm+'</b>'+(age!==""?', '+age+' years old':'')+', a resident of '+esc(p.puroks?.name||"this barangay")+', Barangay Talisay, Santa Fe, Cebu, for <b>____</b> year(s), availing the benefits of Republic Act 11261, otherwise known as the First Time Jobseekers Assistance Act, do hereby declare, agree and undertake to abide and be bound by the following:</p><ol style="line-height:inherit;margin:8px 0 8px 22px;text-align:justify"><li>That this is the first time that I will actually look for a job, and therefore, I request that a Barangay Certification be issued in my favor to avail the benefits of the law;</li><li>That I am aware that the benefit and privilege under the said law shall be enjoyed by me only once;</li><li>That I will inform and/or report to the Barangay, personally, through text or other means, or through my family or relatives, once I get employed;</li><li>That I am not a beneficiary of the JobStart Program under RA 10869 and other laws that give similar exemptions for the documents or transactions covered by RA 11261;</li><li>That if I am granted the certification, I will not use it in any fraud, nor forge or falsify any document for the purpose of obtaining the benefits of the law; and</li><li>That I will comply with my duties and responsibilities under the law. Should I violate any provision of this Oath of Undertaking and the law, I may be penalized as provided by law.</li></ol><p>Signed this '+ord(d.getDate())+' day of '+MONTHS[d.getMonth()]+', '+d.getFullYear()+' at Barangay Talisay, Santa Fe, Cebu, Philippines.</p><div style="display:flex;justify-content:space-between;gap:20px;margin-top:30px;text-align:center"><div style="width:46%;border-top:1px solid #000;padding-top:4px"><b>'+nm+'</b><br>First Time Jobseeker<br><small>(Signature over printed name)</small></div><div style="width:46%;border-top:1px solid #000;padding-top:4px"><b>HON. '+esc(PB)+'</b><br>Punong Barangay<br><small>(Witnessed by)</small></div></div></div>';
 const page1='<div class="cert '+(r.type===FJ?'tight':'roomy')+'">'+WM+''+HEAD("OFFICE OF THE PUNONG BARANGAY")+'<h2 class="ct">'+esc(TITLES[r.type]||r.type.toUpperCase())+'</h2><p class="n"><b>TO WHOM IT MAY CONCERN:</b></p><p>'+(BODY[r.type]||"")+'</p><p>Issued this '+ord(d.getDate())+' day of '+MONTHS[d.getMonth()]+', '+d.getFullYear()+' at Barangay Talisay, Santa Fe, Cebu, Philippines.</p><div class="sig'+(r._sig?' hs':'')+'">'+(r._sig?(pv?'<span class="signph">Signature prints here</span>':'<img class="signimg" alt="" draggable="false" src="'+r._sig+'">'):'')+'<b>HON. '+esc(PB)+'</b><br>Punong Barangay</div><div class="cf">'+qr(r,d)+'Ref. No.: '+esc(r.ref_no)+'<br>O.R. No.: '+(r._or?esc(r._or.or_no):"____________")+' &nbsp; Amount paid: '+(r._or?peso(r._or.amount):"____________")+'<br>Prepared by: '+esc(me.full_name)+(r.approved_at?'<br>Approved by the Punong Barangay on '+longD(new Date(r.approved_at))+'<br>Valid for one (1) year, until <b>'+longD(expOf(r))+'</b>':"")+'<br>Scan the QR code to check that this certificate is genuine.</div></div>';return page1+oath}
async function openPrint(id){

function upHTML(a){
 if(!a.length)return'<div class="panel"><h2>Upcoming hearings</h2><p class="note">No hearings in the next 14 days.</p></div>';
 const t=todayStr(),tm=ymd(new Date(Date.now()+864e5));
 return'<div class="panel"><h2>Upcoming hearings (next 14 days)</h2>'+tbl(["Date","Time","Case","Complainant","Respondent",""],a.map(x=>[fmtD(x.hearing_date),x.hearing_time?fmtT(x.hearing_time):"",x.case_no,x.complainant_name,x.respondent_name,x.hearing_date===t?{h:'<span class="chip received">Today</span>'}:x.hearing_date===tm?{h:'<span class="chip verified">Tomorrow</span>'}:""]))+'</div>'}
function docHTML(b,o){
 const k=o.k||"summons1",d=new Date(),c=esc((b.complainant_name||"").toUpperCase()),r=esc((b.respondent_name||"").toUpperCase());
 if(k.startsWith("summons"))return summHTML(b,{...o,title:{summons1:"SUMMONS",summons2:"SECOND SUMMONS",summons3:"THIRD SUMMONS"}[k]});
 const ttl=t=>'<h2 class="ct">'+t+'</h2>',when_='<b>'+esc(fmtD(o.d))+'</b> at <b>'+esc(fmtT(o.t))+'</b> at <b>'+esc(o.v||"the Barangay Hall")+'</b>';
 let body;
 if(k==="notice")body=ttl("NOTICE OF HEARING")+'<p class="n"><b>TO: '+c+'</b>, Complainant</p><p>You are hereby notified that your complaint against <b>'+r+'</b> for “'+esc(b.incident)+'” is set for hearing and mediation before the Punong Barangay on '+when_+'.</p><p>You are requested to appear in person and to bring your witnesses. Your failure to appear without a justifiable reason may result in the dismissal of your complaint.</p>';
 else if(k==="kasunduan")body=ttl("KASUNDUAN (AMICABLE SETTLEMENT)")+'<p>We, <b>'+c+'</b>, Complainant, and <b>'+r+'</b>, Respondent, both of legal age and residents of Barangay Talisay, Santa Fe, Cebu, having voluntarily agreed to settle our dispute (“'+esc(b.incident)+'”) before the Punong Barangay on <b>'+esc(fmtD(o.d))+'</b>, agree to the following terms:</p><p class="n" style="min-height:90px">'+(o.x?esc(o.x).replace(/\n/g,"<br>"):"______________________________________________<br>______________________________________________")+'</p><p>We understand that this settlement shall have the force and effect of a final judgment of a court after ten (10) days from its date, unless it is repudiated within that period as provided by law.</p><div style="display:flex;justify-content:space-between;margin-top:36px;text-align:center"><div style="width:44%;border-top:1px solid #000">'+c+'<br>Complainant</div><div style="width:44%;border-top:1px solid #000">'+r+'<br>Respondent</div></div>';
 else body=ttl("CERTIFICATE TO FILE ACTION")+'<p class="n"><b>TO WHOM IT MAY CONCERN:</b></p><p>This is to certify that in Barangay Case No. <b>'+esc(b.case_no)+'</b>, entitled <b>'+c+'</b> versus <b>'+r+'</b>, for “'+esc(b.incident)+'”: '+esc(o.g)+'</p><p>Therefore, the corresponding complaint may now be filed in the proper court or government office.</p><p>This certification is issued upon the request of the complainant, <b>'+c+'</b>.</p>';
 return'<div class="cert tight">'+WM+''+HEAD("OFFICE OF THE PUNONG BARANGAY<br>LUPONG TAGAPAMAYAPA")+'<div style="text-align:right;margin-top:12px">Barangay Case No. <b>'+esc(b.case_no)+'</b></div>'+body+'<p>Issued this '+ord(d.getDate())+' day of '+MONTHS[d.getMonth()]+', '+d.getFullYear()+' at Barangay Talisay, Santa Fe, Cebu, Philippines.</p><div class="sig"><b>HON. '+esc(PB)+'</b><br>Punong Barangay'+(k==="kasunduan"?'<br><small>(Attested)</small>':'')+'</div><div class="cf">Prepared by: '+esc(me.full_name)+'</div></div>'}
const sv=()=>({k:$("sdoc").value,d:$("sd").value,t:$("st").value,v:$("sv").value,x:$("sx").value,g:$("sg").value});
function refreshDoc(id){const b=ROWS.blotter[id],o=sv();$("xrow").hidden=o.k!=="kasunduan";$("grow").hidden=o.k!=="cfa";$("prev").innerHTML=docHTML(b,o)}
function openSumm(id){
 const b=ROWS.blotter[id];if(!b)return;dlg.className="wide";
 dlg.innerHTML='<h2>Barangay case documents</h2><div class="frm"><label>Document<select id="sdoc" data-rid="'+id+'">'+opts(Object.entries(DOCS))+'</select></label><label>Date<input id="sd" type="date" data-rid="'+id+'" value="'+esc(b.hearing_date||"")+'"></label><label>Time<input id="st" type="time" data-rid="'+id+'" value="'+esc(b.hearing_time||"")+'"></label><label>Place<input id="sv" data-rid="'+id+'" value="Barangay Hall, Barangay Talisay"></label></div><label id="xrow" hidden>Settlement terms (one per line)<textarea id="sx" rows="4" data-rid="'+id+'"></textarea></label><label id="grow" hidden>Ground<select id="sg" data-rid="'+id+'">'+opts(GROUNDS)+'</select></label><div class="prev" id="prev"></div><div class="acts"><button class="btn" data-dosumm="'+id+'">Print</button><button type="button" class="btn ghost" data-close>Close</button></div><p class="note">Choose the document, adjust the details, and check the preview before printing. Use “Edit” on the case to save a hearing date.</p>';
 refreshDoc(id);dlg.showModal()}
function doSumm(id){
 const b=ROWS.blotter[id];if(!b)return;const o=sv();
 $("cert").innerHTML=docHTML(b,o);
 logEv({p_action:"PRINT",p_detail:DOCS[o.k]+" "+b.case_no});
 window.print()}
const dlg=$("dlg");
function openEdit(t,id){
 const row=ROWS[t][id];if(!row)return;
 dlg.className="";dlg.innerHTML='<h2>Edit '+CFG[t].n+'</h2><form class="frm one" data-f="edit|'+t+'|'+id+'">'+CFG[t].f(true).map(f=>fld(f,typeof row[f[0]]==="boolean"?String(row[f[0]]):row[f[0]])).join('')+'<div class="acts"><button class="btn">Save changes</button><button type="button" class="btn ghost" data-close>Cancel</button></div></form>';dlg.showModal()}
function openDel(t,id){
 const r=ROWS[t][id]||{},name=(r.full_name||(r.ref_no?r.ref_no+(r.residents?.full_name?" · "+r.residents.full_name:""):""))||r.case_no||r.or_no||r.description||r.program||(r.household_no?"Household "+r.household_no:r.address)||"this record";
 dlg.className="";dlg.innerHTML='<h2>Delete '+CFG[t].n+'?</h2><p>“'+esc(name)+'” will be removed. '+(BIN?'It goes to “Deleted items” and can be restored for 30 days.':'This action is recorded in the activity log and can’t be undone.')+'</p><form class="frm one" data-f="del|'+t+'|'+id+'"><div class="acts"><button class="btn danger">Yes, delete</button><button type="button" class="btn ghost" data-close>Cancel</button></div></form>';dlg.showModal()}
document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest(".cert,#cert,#prev"))e.preventDefault()});
document.addEventListener("dragstart",e=>{if(e.target.tagName==="IMG")e.preventDefault()});
document.addEventListener("submit",async e=>{
 e.preventDefault();const f=e.target,n=f.dataset.f,o=Object.fromEntries(new FormData(f));
 if(n==="login"){const r=await sb.auth.signInWithPassword({email:o.email,password:o.password});if(r.error)return say("Sign-in failed. Check your email and password.");say("");await boot();logEv({p_action:"SIGN_IN"});return}
 if(n==="rsearch"){RQ=(o.q||"").trim();RP=0;return draw()}
 if(n==="asearch"){AQ=(o.q||"").trim();AP=0;return draw()}
 if(n==="hsearch"){HQ=(o.q||"").trim();HP=0;return draw()}
 if(n==="qsearch"){QQ=(o.q||"").trim();QP=0;return draw()}
 if(n==="hhsearch"){HHQ=(o.q||"").trim();HHP=0;return draw()}
 if(n.startsWith("addmem|")){const hid=n.split("|")[1];if(!o.resident_id)return dsay("Search and choose a resident from the list first.");
  const r=await sb.rpc("set_household_member",{p_resident:o.resident_id,p_household:hid});if(r.error)return dsay(r.error.message);await draw();return openMembers(hid)}
 if(n.startsWith("hhealth|")){const hid=n.split("|")[1],pc=String(o.pregnant_count||"").trim(),nz=k=>o[k]||null;
  const r=await sb.from("household_health").upsert({household_id:hid,water_source:nz("water_source"),toilet:nz("toilet"),garbage:nz("garbage"),pregnant_count:pc===""?null:Math.max(0,parseInt(pc,10)||0),family_planning:nz("family_planning"),philhealth:nz("philhealth"),notes:nz("notes"),updated_at:new Date().toISOString()}).select();
  if(r.error)return dsay(r.error.message);dlg.close();say("Health survey saved.",1);return draw()}
 if(f.querySelector('[name="resident_id"]')&&!o.resident_id)return say("Please search and choose a resident from the list.");
 const [m,t,id]=n.split("|");
 if(CFG[m]){if(f.dataset.busy)return;f.dataset.busy=1;setTimeout(()=>{delete f.dataset.busy},2500)}
 if(m==="residents"){o.full_name=(o.full_name||"").trim().replace(/\s+/g," ");let q=sb.from("residents").select("id").ilike("full_name",o.full_name.replace(/[%_]/g,"")).limit(1);q=o.birthdate?q.eq("birthdate",o.birthdate):q.is("birthdate",null);const d=await q;
  if(d.data&&d.data.length){delete f.dataset.busy;return say("“"+o.full_name+"”"+(o.birthdate?" (born "+o.birthdate+")":"")+" is already in the registry. Search for the name and use Edit instead of adding again.")}}
 if(m==="requests"&&o.type===FJ){const d=await sb.from("requests").select("ref_no,status").eq("resident_id",o.resident_id).eq("type",FJ).limit(1);
  if(d.data&&d.data.length){delete f.dataset.busy;return say("This resident already has a First time jobseeker certification ("+d.data[0].ref_no+"). Under RA 11261 it can be issued only once.")}}
 if(m==="requests"){const d=await sb.from("requests").select("ref_no,status").eq("resident_id",o.resident_id).eq("type",o.type).neq("status","released").limit(1);
  if(d.data&&d.data.length){delete f.dataset.busy;return say("This resident already has an unfinished “"+o.type+"” request ("+d.data[0].ref_no+", "+d.data[0].status+"). Finish or delete that one first.")}}
 if(m==="edit"){if(ok(await sb.from(t).update(pre(t,o)).eq("id",id).select())){dlg.close();say("Changes saved.",1);draw()}return}
 if(m==="del"){if(ok(await sb.from(t).delete().eq("id",id).select())){dlg.close();say("Deleted.",1);draw()}else dlg.close();return}
 if(m==="requests")o.ref_no="REQ-"+new Date().toISOString().slice(2,7).replace("-","")+"-"+Math.floor(100+Math.random()*900);
 if(ok(await sb.from(m).insert(pre(m,o)).select())){say("Added.",1);draw()}
});
let pkT;
document.addEventListener("input",e=>{
 if(e.target.dataset.pk!==undefined){clearTimeout(pkT);const el=e.target,q=el.value.trim();el.nextElementSibling.value="";
  pkT=setTimeout(async()=>{const box=el.parentElement.querySelector(".pkres");if(q.length<2){box.innerHTML="";return}
   const r=await sb.from("residents_basic").select("id,full_name,birthdate,purok_id").ilike("full_name",lk(q)).order("full_name").limit(8);const PN=Object.fromEntries(PU);
   box.innerHTML=(r.data||[]).map(x=>'<button type="button" class="pkopt" data-pick="'+x.id+'" data-name="'+esc(x.full_name)+'">'+esc(x.full_name)+'<small>'+[x.birthdate?"Born "+esc(x.birthdate):"No birthdate",PN[x.purok_id]?esc(PN[x.purok_id]):""].filter(Boolean).join(" · ")+'</small></button>').join("")||'<span class="note">No match. Check the spelling, or add the resident first.</span>'},250);return}
 if(["sdoc","sd","st","sv","sx","sg"].includes(e.target.id)){refreshDoc(e.target.dataset.rid);return}if(e.target.id==="pur"||e.target.id==="ext"){const r=ROWS.requests[e.target.dataset.rid];r._ext=$("ext")?$("ext").value:"";$("prev").innerHTML=certHTML(r,$("pur")?$("pur").value:"",true);return}const k=e.target.dataset.filter;if(!k)return;const q=e.target.value.toLowerCase();document.querySelectorAll("#"+k+" tr").forEach(r=>{r.hidden=!r.textContent.toLowerCase().includes(q)})});
document.addEventListener("click",async e=>{
 document.querySelectorAll(".pkres").forEach(x=>{if(!x.parentElement.contains(e.target))x.innerHTML=""});
 const b=e.target.closest("button");if(!b)return;
 if("report" in b.dataset)return report();
 if(b.dataset.review)return openReview(b.dataset.review);
 if("alerts" in b.dataset){hideBar();return openAlerts()}
 if("aview" in b.dataset)return goAlert();
 if("aclose" in b.dataset)return hideBar();
 if("asilence" in b.dataset)return stopAlert();
 if("altest" in b.dataset){if(AN)return stopAlert();if(await ensureAudio())playAlert();else say("The browser is blocking sound. Tap anywhere on the page once, then try again.");return}
 if("alperm" in b.dataset){try{await Notification.requestPermission()}catch(e){}return openAlerts()}
 if("alinstall" in b.dataset){if(INST){INST.prompt();INST=null}return dlg.close()}
 if("apall" in b.dataset){const ids=[...SEL];if(!ids.length)return;dlg.className="";dlg.innerHTML='<h2>Approve '+ids.length+' certificate'+(ids.length>1?"s":"")+'?</h2><p class="note">Your signature will print on these certificates.</p><ul>'+ids.map(i=>'<li>'+esc((APR[i]?APR[i].ref_no+" · "+(APR[i].residents?.full_name||"")+" · "+APR[i].type:i))+'</li>').join("")+'</ul><div class="acts"><button class="btn" data-doapall>Yes, approve</button><button type="button" class="btn ghost" data-close>Cancel</button></div>';dlg.showModal();return}
 if("doapall" in b.dataset){b.disabled=true;const ids=[...SEL],r=await sb.from("requests").update({status:"approved"}).in("id",ids).eq("status","verified").select();if(r.error){b.disabled=false;return say(r.error.message)}const n=(r.data||[]).length;dlg.close();SEL.clear();say("Approved "+n+" certificate"+(n===1?"":"s")+".",1);logEv({p_action:"APPROVE",p_detail:n+" certificates approved together"});draw();updateTitle();return}
 if("tpl" in b.dataset)return tpl();
 if("doimp" in b.dataset)return doImport();
 if(b.dataset.summ)return openSumm(b.dataset.summ);
 if(b.dataset.dosumm)return doSumm(b.dataset.dosumm);
 if(b.dataset.print)return openPrint(b.dataset.print);
 if(b.dataset.doprint)return doPrint(b.dataset.doprint);
 if(b.dataset.pick){const l=b.closest("label");l.querySelector("[data-pk]").value=b.dataset.name;l.querySelector("input[type=hidden]").value=b.dataset.pick;l.querySelector(".pkres").innerHTML="";return}
 if("srtoggle" in b.dataset){SR=!SR;RP=0;return draw()}
 if("srexcel" in b.dataset)return exportSeniors();
 if("allexcel" in b.dataset)return exportResidents();
 if("listexcel" in b.dataset)return exportResidents(true);
 if("popexcel" in b.dataset)return exportPopulation();
 if("reqexcel" in b.dataset)return exportRequests();
 if("finexcel" in b.dataset)return exportFinance();
 if(b.dataset.rpage){RP=Math.max(0,RP+ +b.dataset.rpage);return draw()}
 if(b.dataset.qpage){QP=Math.max(0,QP+ +b.dataset.qpage);return draw()}
 if(b.dataset.hpage){HP=Math.max(0,HP+ +b.dataset.hpage);return draw()}
 if("qclear" in b.dataset){QQ="";QP=0;return draw()}
 if(b.dataset.restore){b.disabled=true;const r=await sb.rpc("restore_deleted",{p_id:b.dataset.restore});if(r.error){b.disabled=false;return say(r.error.message)}say("Restored.",1);return draw()}
 if("aclear" in b.dataset){AQ="";AP=0;return draw()}
 if("arefresh" in b.dataset)return draw();
 if("aexcel" in b.dataset)return exportAudit();
 if(b.dataset.apage){AP=Math.max(0,AP+ +b.dataset.apage);return draw()}
 if("rclear" in b.dataset){RQ="";RP=0;return draw()}
 if("hclear" in b.dataset){HQ="";HP=0;return draw()}
 if("agshow" in b.dataset)return agShow();
 if("agexcel" in b.dataset)return agExcel();
 if(b.dataset.agnames)return agNames(+b.dataset.agnames);
 if(b.dataset.hmem)return openMembers(b.dataset.hmem);
 if(b.dataset.hhealth)return openHealth(b.dataset.hhealth);
 if(b.dataset.mrem){if(!confirm("Remove this person from the household? The resident record stays in the registry."))return;const hid=b.dataset.hid,r=await sb.rpc("set_household_member",{p_resident:b.dataset.mrem,p_household:null});if(r.error)return dsay(r.error.message);await draw();return openMembers(hid)}
 if(b.dataset.mhead){const hid=b.dataset.hid,r=await sb.from("households").update({head_resident_id:b.dataset.mhead}).eq("id",hid).select();if(r.error)return dsay(r.error.message);await draw();return openMembers(hid)}
 if(b.dataset.hhpage){HHP=Math.max(0,HHP+ +b.dataset.hhpage);return draw()}
 if("hhclear" in b.dataset){HHQ="";HHP=0;return draw()}
 if("hhexcel" in b.dataset)return exportHouseholds();
 if("close" in b.dataset)return dlg.close();
 if(b.dataset.edit)return openEdit(...b.dataset.edit.split("|"));
 if(b.dataset.del)return openDel(...b.dataset.del.split("|"));
 if(b.id==="out"){await logEv({p_action:"SIGN_OUT"});await sb.auth.signOut();say("");return loginScreen()}
 if(b.dataset.t){tab=b.dataset.t;say("");return draw()}
 if(b.dataset.adv){const to=b.dataset.to,lb=b.dataset.lab||"",cap=me.role==="captain";b.disabled=true;
  if(ok(await sb.from("requests").update({status:to}).eq("id",b.dataset.adv).select())){if(dlg.open)dlg.close();SEL.delete(b.dataset.adv);
   say(to==="approved"?"Approved "+lb+".":cap&&to==="verified"?"Taken back "+lb+". It is waiting for your approval again.":cap&&to==="received"?"Returned "+lb+" to the secretary.":"Updated.",1);
   if(cap)logEv({p_action:to==="approved"?"APPROVE":to==="received"?"RETURN":"TAKE_BACK",p_detail:lb});draw();updateTitle()}else b.disabled=false;return}
 if(b.dataset.save){const id=b.dataset.save,role=document.querySelector('[data-role="'+id+'"]').value||null,a=document.querySelector('[data-act="'+id+'"]').checked;
  if(a&&!role)return say("Choose a role before activating this account.");
  if(ok(await sb.from("profiles").update({role,is_active:a}).eq("id",id).select())){logEv({p_action:"ROLE_CHANGE",p_detail:"Account "+id+" set to "+(role||"none")+(a?", active":", inactive")});say("Account saved.",1);draw()}}
});
document.addEventListener("change",e=>{
 if(e.target.id==="alon"){ALON=e.target.checked;lsSet("alerts",ALON?"on":"off");if(!ALON)stopAlert();draw();return}
 if(e.target.id==="alvol"){ALVOL=+e.target.value||0.7;lsSet("alertvol",String(ALVOL));return}
 if(e.target.matches&&e.target.matches("[data-sel],[data-selall]")){const t=e.target;
  if("selall" in t.dataset)document.querySelectorAll("[data-sel]").forEach(c=>{c.checked=t.checked;t.checked?SEL.add(c.dataset.sel):SEL.delete(c.dataset.sel)});else t.checked?SEL.add(t.dataset.sel):SEL.delete(t.dataset.sel);
  const n=SEL.size,bt=document.querySelector("[data-apall]"),sa=document.querySelector("[data-selall]");if(bt){bt.disabled=!n;bt.textContent="Approve selected ("+n+")"}if(sa)sa.checked=n>0&&n===document.querySelectorAll("[data-sel]").length;return}
 if(e.target.id==="agpre"&&e.target.value){AGT=e.target.value;$("agtxt").value=AGT}
 if(e.target.id==="agtxt"){AGT=e.target.value;const ps=$("agpre");if(ps)ps.value=AGPRE.some(p=>p[0]===AGT)?AGT:""}
 if(e.target.id==="agpu")AGU=e.target.value;
 if(e.target.id==="agdt")AGD=e.target.value||todayStr();
 if(e.target.id==="aup"){APER=e.target.value;AP=0;draw()}
 if(e.target.id==="aur"){AR=e.target.value;AP=0;draw()}
 if(e.target.id==="aua"){AA=e.target.value;AP=0;draw()}
 if(e.target.id==="hhpf"){HHF=e.target.value;HHP=0;draw()}
 if(e.target.id==="raf"){AF=e.target.value;RP=0;draw()}
 if(e.target.id==="rcf"){CF=e.target.value;RP=0;draw()}
 if(e.target.id==="rgf"){GF=e.target.value;RP=0;draw()}
 if(e.target.id==="rpf"){PF=e.target.value;RP=0;draw()}
 if(e.target.id==="rsx"){SXF=e.target.value;RP=0;draw()}
 if(e.target.id==="mo"&&e.target.value){MONTH=e.target.value;draw()}
 if(e.target.id==="xl"&&e.target.files[0]){parseImport(e.target.files[0]);e.target.value=""}});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
$("msg").addEventListener("click",()=>say(""));
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(()=>{});navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="alert-open")goAlert()})}
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")loginScreen()});
boot();
</script>
