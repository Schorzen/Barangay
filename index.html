<style>
:root{--ink:#16263B;--mute:#51627A;--sun:#E8A317;--coral:#B93A24;--teal:#0F7A69;--accent:#1F3A5F;--line:rgba(31,58,95,.16);--glass:rgba(255,255,255,.62);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{color:var(--ink);font:400 17px/1.5 "Source Sans 3",system-ui,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px);background:#EEF3F8}

h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
.glass,.panel,.stat,dialog,header{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.85)}
header{position:sticky;top:0;z-index:5;border-width:0 0 1px;border-bottom-color:var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;background:rgba(255,255,255,.72)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;max-width:1000px;margin:0 auto}

.me{text-align:right;font-size:.88rem;color:var(--mute)}.me b{color:var(--ink);display:block}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1000px;margin:0 auto;padding-bottom:10px}

main{max-width:1000px;margin:0 auto;padding:6px 16px 36px}
.panel{border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 8px 28px rgba(31,58,95,.12)}
.panel h2{font-size:1.15rem;margin-bottom:10px;color:var(--accent)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:14px}
.stat{border-radius:16px;padding:12px 16px;border-top:4px solid var(--sun);box-shadow:0 6px 20px rgba(31,58,95,.1)}
.stat:nth-child(2){border-top-color:#2BB5A0}.stat:nth-child(3){border-top-color:#E0644B}
.stat b{display:block;font:700 1.75rem "Bricolage Grotesque",sans-serif;color:var(--accent)}.stat span{color:var(--mute);font-size:.9rem}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
tbody tr:hover{background:rgba(255,255,255,.7)}
.chip{display:inline-block;padding:2px 11px;border-radius:99px;font-size:.8rem;font-weight:600;background:#E4E8EE;color:#46556A}
.chip.received{background:#FDEBB9;color:#6B4A00}.chip.verified{background:#D6E3FF;color:#1E3F8A}
.chip.approved{background:#CDEFE8;color:#0B5A4D}.chip.released{background:#E4E8EE;color:#46556A}
.btn{font:600 .92rem "Source Sans 3",sans-serif;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;box-shadow:0 3px 10px rgba(31,58,95,.25)}
.btn.ghost,.ic{background:rgba(255,255,255,.8);color:var(--accent);border:1px solid var(--line);box-shadow:none}
.btn.danger,.ic.del{background:#FCE8E4;color:var(--coral);border:1px solid #F2B9AE;box-shadow:none}
.ic{font:600 .8rem "Source Sans 3",sans-serif;border-radius:8px;padding:5px 11px;cursor:pointer;margin-right:4px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2F6FDE;outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.btn,.ic,nav button{transition:transform .15s,background .15s}.btn:hover{transform:translateY(-1px)}}
.frm{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;margin-bottom:14px}
.frm.one{grid-template-columns:1fr;margin:12px 0 0}.acts{display:flex;gap:8px}
label{font-size:.82rem;color:var(--mute);display:grid;gap:4px;font-weight:600}
[hidden]{display:none!important}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid rgba(31,58,95,.25);border-radius:10px;background:rgba(255,255,255,.85);color:var(--ink);min-width:0;width:100%}
input::placeholder{color:#7A8AA0}input[type=checkbox]{width:auto}
.search{max-width:300px;margin-bottom:10px}
.login{max-width:390px;margin:56px auto}.login .frm{grid-template-columns:1fr}
#msg{margin:14px 0 0;padding:10px 14px;border-radius:12px;background:#FCE8E4;color:#8A2B1B;border:1px solid #F2B9AE;font-size:.95rem}
#msg.good{background:#D8F3EC;color:#0B5A4D;border-color:#9ADBC9}
dialog{color:var(--ink);border-radius:20px;padding:20px;width:min(460px,calc(100% - 32px));background:rgba(255,255,255,.86);box-shadow:0 20px 60px rgba(31,58,95,.3)}
dialog::backdrop{background:rgba(20,35,60,.35);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.note{color:var(--mute);font-size:.88rem}.bad{color:var(--coral);font-weight:600}
dialog.wide{width:min(780px,calc(100% - 32px));max-height:92vh;overflow:auto}
dialog{max-height:92vh;overflow:auto}
.prev{border:1px solid var(--line);margin:12px 0;overflow:auto;background:#fff}
#cert{display:none}
.cert{font-family:Georgia,"Times New Roman",serif;color:#000;background:#fff;border:3px double #1F3A5F;padding:26px 32px;line-height:1.7;font-size:15px;min-width:520px}
.cert .ch{text-align:center;line-height:1.35}.cert .ch b{font-size:1.35em;letter-spacing:.05em}
.cert h2.ct{font-family:inherit;color:#000;text-align:center;font-size:1.5em;letter-spacing:.06em;margin:20px 0;text-decoration:underline}
.cert p{text-indent:2em;text-align:justify;margin:10px 0}.cert p.n{text-indent:0}
.cert .sig{margin:46px 0 0 auto;width:270px;text-align:center;border-top:1px solid #000;padding-top:4px}
.cert .cf{margin-top:26px;font-size:.82em;line-height:1.6}
.bar{display:grid;grid-template-columns:130px 1fr 48px;gap:8px;align-items:center;margin:8px 0;font-size:.93rem}
.bar i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,#2BB5A0,#1F3A5F)}
.bar em{font-style:normal;text-align:right;color:var(--mute)}
.cert .cf{overflow:hidden}.cert .qr{float:left;margin:0 14px 0 0;width:84px;height:84px;image-rendering:pixelated}
.sf{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.sf input{max-width:300px}
.pkres{display:grid;gap:4px}.pkopt{text-align:left;font:inherit;font-weight:400;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}.pkopt:hover{background:#EAF1FB}
@page{size:A4;margin:16mm}
@media print{body::before{display:none}header,main,dialog{display:none!important}body{background:#fff}#cert{display:block!important}.cert{font-size:12pt;min-width:0}}
</style>
</head>

 blotter:{n:"blotter case",f:()=>[["case_no","Case no.","text"],["complainant_name","Complainant","text"],["respondent_name","Respondent","text"],["respondent_address","Respondent’s address","text","opt"],["incident","Complaint / incident","text"],["hearing_date","Hearing date","date","opt"],["hearing_time","Hearing time","time","opt"],["status","Status","select",BST]]},
 payments:{n:"receipt",f:()=>[["or_no","OR no.","text"],["payer_name","Payer","text"],["item","Item","text"],["amount","Amount","number"],["request_ref","Linked request (optional)","select",UNPAID,"opt"]]},
 expenses:{n:"expense",f:()=>[["description","Description","text"],["amount","Amount","number"]]},

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const fld=(f,v)=>f[2]==="person"?'<label>'+f[1]+'<input data-pk placeholder="Type at least 2 letters of the name…" autocomplete="off"><input type="hidden" name="'+f[0]+'"><div class="pkres"></div></label>':'<label>'+f[1]+(f[2]==="select"?'<select name="'+f[0]+'"'+(f[4]==="opt"?'':' required')+'>'+opts(f[3],v)+'</select>':'<input name="'+f[0]+'" type="'+f[2]+'"'+(f[2]==="number"?' step="0.01" min="0"':'')+(f[3]==="opt"?'':' required')+' value="'+esc(v??"")+'">')+'</label>';
const form=(name,fields,btn)=>'<form class="frm" data-f="'+name+'">'+fields.map(f=>fld(f)).join('')+'<button class="btn">'+btn+'</button></form>';
const keep=(t,a)=>{ROWS[t]=Object.fromEntries((a||[]).map(x=>[x.id,x]))};
const act=(t,id,w)=>w?'<button class="ic" data-edit="'+t+'|'+id+'">Edit</button><button class="ic del" data-del="'+t+'|'+id+'">Delete</button>':"";
const addForm=(t,w,btn)=>w?form(t,(CFG[t].x?CFG[t].x():[]).concat(CFG[t].f(false)),btn):"";

async function reqQuery(){
 let q=sb.from("requests").select("id,ref_no,type,status,residents(full_name,birthdate,sex,puroks(name))",{count:"exact"}).order("requested_at",{ascending:false});
 if(QQ){const t=QQ.replace(/[%_,()*]/g,""),m=await sb.from("residents").select("id").ilike("full_name",lk(t)).limit(100),ids=(m.data||[]).map(x=>x.id);
  q=ids.length?q.or("ref_no.ilike.*"+t+"*,resident_id.in.("+ids.join(",")+")"):q.ilike("ref_no","%"+t+"%")}

async dash(){

 const sum=a=>(a.data||[]).reduce((t,x)=>t+ +x.amount,0),tp=sum(p),te=sum(e),by={},st={};
 const pk=await sb.from("puroks").select("id,name").order("name"),pc=await Promise.all((pk.data||[]).map(x=>sb.from("residents").select("id",{count:"exact",head:true}).eq("purok_id",x.id)));(pk.data||[]).forEach((x,i)=>{by[x.name]=pc[i].count||0});

 const mx=Math.max(1,...Object.values(by));
 return '<div class="panel"><h2>Monthly overview</h2><div class="acts" style="flex-wrap:wrap;align-items:end"><label>Month<input type="month" id="mo" value="'+MONTH+'"></label><button class="btn" data-report>Download Excel report</button></div></div>'+
 '<div class="grid"><div class="stat"><b>'+(rs.count||0)+'</b><span>Residents</span></div><div class="stat"><b>'+(q.data||[]).length+'</b><span>Requests this month</span></div><div class="stat"><b>'+(h.data||[]).length+'</b><span>Health visits</span></div><div class="stat"><b>'+peso(tp)+'</b><span>Collected</span></div><div class="stat"><b>'+peso(te)+'</b><span>Spent</span></div><div class="stat"><b>'+peso(tp-te)+'</b><span>Balance</span></div></div>'+
 upHTML(upcoming(bl.data))+'<div class="panel"><h2>Residents per purok</h2>'+(Object.keys(by).sort().map(n=>'<div class="bar"><span>'+esc(n)+'</span><i style="width:'+Math.max(2,by[n]/mx*100)+'%"></i><em>'+by[n]+'</em></div>').join("")||'<p class="note">No residents yet.</p>')+'</div>'+

 refreshDoc(id);dlg.showModal()}
function doSumm(id){
 const b=ROWS.blotter[id];if(!b)return;const o=sv();
 $("cert").innerHTML=docHTML(b,o);
 sb.rpc("log_event",{p_action:"PRINT",p_detail:DOCS[o.k]+" "+b.case_no});
 window.print()}
const dlg=$("dlg");
function openEdit(t,id){
 const row=ROWS[t][id];if(!row)return;
 dlg.className="";dlg.innerHTML='<h2>Edit '+CFG[t].n+'</h2><form class="frm one" data-f="edit|'+t+'|'+id+'">'+CFG[t].f(true).map(f=>fld(f,row[f[0]])).join('')+'<div class="acts"><button class="btn">Save changes</button><button type="button" class="btn ghost" data-close>Cancel</button></div></form>';dlg.showModal()}
function openDel(t,id){
 const r=ROWS[t][id]||{},name=r.full_name||r.ref_no||r.case_no||r.or_no||r.description||r.program||"this record";
 dlg.className="";dlg.innerHTML='<h2>Delete '+CFG[t].n+'?</h2><p>“'+esc(name)+'” will be removed. This action is recorded in the activity log and can’t be undone.</p><form class="frm one" data-f="del|'+t+'|'+id+'"><div class="acts"><button class="btn danger">Yes, delete</button><button type="button" class="btn ghost" data-close>Cancel</button></div></form>';dlg.showModal()}
document.addEventListener("submit",async e=>{
 e.preventDefault();const f=e.target,n=f.dataset.f,o=Object.fromEntries(new FormData(f));
 if(n==="login"){const r=await sb.auth.signInWithPassword({email:o.email,password:o.password});if(r.error)return say("Sign-in failed. Check your email and password.");say("");await boot();sb.rpc("log_event",{p_action:"SIGN_IN"});return}
 if(n==="rsearch"){RQ=(o.q||"").trim();RP=0;return draw()}
 if(n==="hsearch"){HQ=(o.q||"").trim();HP=0;return draw()}
 if(n==="qsearch"){QQ=(o.q||"").trim();QP=0;return draw()}
 if(f.querySelector('[name="resident_id"]')&&!o.resident_id)return say("Please search and choose a resident from the list.");
 const [m,t,id]=n.split("|");
 if(m==="edit"){if(ok(await sb.from(t).update(pre(t,o)).eq("id",id).select())){dlg.close();say("Changes saved.",1);draw()}return}
 if(m==="del"){if(ok(await sb.from(t).delete().eq("id",id).select())){dlg.close();say("Deleted.",1);draw()}else dlg.close();return}
 if(m==="requests")o.ref_no="REQ-"+new Date().toISOString().slice(2,7).replace("-","")+"-"+Math.floor(100+Math.random()*900);
 if(ok(await sb.from(m).insert(pre(m,o)).select())){say("Added.",1);draw()}
});
let pkT;
document.addEventListener("input",e=>{
 if(e.target.dataset.pk!==undefined){clearTimeout(pkT);const el=e.target,q=el.value.trim();el.nextElementSibling.value="";
  pkT=setTimeout(async()=>{const box=el.parentElement.querySelector(".pkres");if(q.length<2){box.innerHTML="";return}
   const r=await sb.from("residents_basic").select("id,full_name,birthdate").ilike("full_name",lk(q)).order("full_name").limit(8);
   box.innerHTML=(r.data||[]).map(x=>'<button type="button" class="pkopt" data-pick="'+x.id+'" data-name="'+esc(x.full_name)+'">'+esc(x.full_name)+(x.birthdate?" · "+esc(x.birthdate):"")+'</button>').join("")||'<span class="note">No match. Check the spelling, or add the resident first.</span>'},250);return}
 if(["sdoc","sd","st","sv","sx","sg"].includes(e.target.id)){refreshDoc(e.target.dataset.rid);return}if(e.target.id==="pur"){$("prev").innerHTML=certHTML(ROWS.requests[e.target.dataset.rid],e.target.value);return}const k=e.target.dataset.filter;if(!k)return;const q=e.target.value.toLowerCase();document.querySelectorAll("#"+k+" tr").forEach(r=>{r.hidden=!r.textContent.toLowerCase().includes(q)})});
document.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if("report" in b.dataset)return report();
 if("tpl" in b.dataset)return tpl();
 if("doimp" in b.dataset)return doImport();
 if(b.dataset.summ)return openSumm(b.dataset.summ);
 if(b.dataset.dosumm)return doSumm(b.dataset.dosumm);
 if(b.dataset.print)return openPrint(b.dataset.print);
 if(b.dataset.doprint)return doPrint(b.dataset.doprint);
 if(b.dataset.pick){const l=b.closest("label");l.querySelector("[data-pk]").value=b.dataset.name;l.querySelector("input[type=hidden]").value=b.dataset.pick;l.querySelector(".pkres").innerHTML="";return}
 if(b.dataset.rpage){RP=Math.max(0,RP+ +b.dataset.rpage);return draw()}
 if(b.dataset.qpage){QP=Math.max(0,QP+ +b.dataset.qpage);return draw()}
 if(b.dataset.hpage){HP=Math.max(0,HP+ +b.dataset.hpage);return draw()}
 if("qclear" in b.dataset){QQ="";QP=0;return draw()}
 if("rclear" in b.dataset){RQ="";RP=0;return draw()}
 if("hclear" in b.dataset){HQ="";HP=0;return draw()}
 if("close" in b.dataset)return dlg.close();
 if(b.dataset.edit)return openEdit(...b.dataset.edit.split("|"));
 if(b.dataset.del)return openDel(...b.dataset.del.split("|"));
 if(b.id==="out"){await sb.rpc("log_event",{p_action:"SIGN_OUT"});await sb.auth.signOut();say("");return loginScreen()}
 if(b.dataset.t){tab=b.dataset.t;say("");sb.rpc("log_event",{p_action:"VIEW",p_detail:MODS[tab]});return draw()}
 if(b.dataset.adv){if(ok(await sb.from("requests").update({status:b.dataset.to}).eq("id",b.dataset.adv).select()))draw();return}
 if(b.dataset.save){const id=b.dataset.save,role=document.querySelector('[data-role="'+id+'"]').value||null,a=document.querySelector('[data-act="'+id+'"]').checked;
  if(a&&!role)return say("Choose a role before activating this account.");
  if(ok(await sb.from("profiles").update({role,is_active:a}).eq("id",id).select())){sb.rpc("log_event",{p_action:"ROLE_CHANGE",p_detail:"Account "+id+" set to "+(role||"none")+(a?", active":", inactive")});say("Account saved.",1);draw()}}
});
document.addEventListener("change",e=>{
 if(e.target.id==="mo"&&e.target.value){MONTH=e.target.value;draw()}
 if(e.target.id==="xl"&&e.target.files[0]){parseImport(e.target.files[0]);e.target.value=""}});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")loginScreen()});
boot();
</script>
</body>
</html>
